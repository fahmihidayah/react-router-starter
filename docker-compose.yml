services:
  # ============================================
  # React Router Application
  # ============================================
  app:
    # Jenkins/VPS uses IMAGE_NAME and IMAGE_TAG; local development keeps these defaults.
    image: ${IMAGE_NAME:-learning-tracker}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - PORT=${PORT:-3000}
    container_name: react-router-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - media-uploads:/app/uploads/media
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const p = process.env.PORT || 3000; fetch('http://localhost:' + p + '/api/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  # Run explicitly during deployment before replacing the application container.
  migrate:
    image: ${IMAGE_NAME:-learning-tracker}:${IMAGE_TAG:-latest}-migrate
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - .env
    networks:
      - app-network
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy

  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-learning_tracker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  web:
    # If your existing PostgreSQL is on a specific network, use:
    # external: true
    # name: your-postgres-network-name
    external: true

volumes:
  media-uploads:
    driver: local
  postgres-data:
    driver: local
